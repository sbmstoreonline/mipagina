<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Football Card Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
    --bg:#07090d;
    --panel:#10141b;
    --border:rgba(255,255,255,.09);
    --text:#f5f7fa;
    --muted:#8992a3;
    --accent:#3498ff;
    --number:#ffffff;
    --label:#3498ff;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(52,152,255,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 92% 90%,
            rgba(255,255,255,.05),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);
    font-family:Inter,sans-serif;
}

button,
input{
    font-family:inherit;
}

.app{
    width:min(1450px,calc(100% - 32px));
    margin:auto;
    padding:25px 0 50px;
}

/* =====================================================
   ENCABEZADO
===================================================== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
}

.back-menu{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    padding:9px 14px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:9px;

    background:rgba(255,255,255,.04);

    color:#aeb8c5;

    text-decoration:none;

    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;

    transition:.2s;
}

.back-menu:hover{
    background:rgba(52,152,255,.12);
    border-color:rgba(52,152,255,.45);
    color:#ffffff;

    transform:translateX(-2px);
}

.header-title{
    font-family:"Space Grotesk";
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
}

.header-title span{
    color:var(--accent);
}

.header small{
    color:var(--muted);
    font-size:10px;
    letter-spacing:.8px;
    margin-top:8px;
}

.workspace{
    display:grid;
    grid-template-columns:390px 1fr;
    gap:22px;
}

.controls{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    height:max-content;
}

.preview-area{
    min-width:0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.section{
    margin-bottom:23px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.section-title h3{
    margin:0;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;
}

.section-title span{
    color:var(--muted);
    font-size:10px;
}

label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin:0 0 6px;
}

input{
    width:100%;
    background:#0b0e14;
    border:1px solid var(--border);
    color:white;
    border-radius:9px;
    padding:11px 12px;
    outline:none;
}

input:focus{
    border-color:var(--accent);
}

.field{
    margin-bottom:11px;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.upload{
    border:1px dashed rgba(255,255,255,.18);
    border-radius:13px;
    padding:17px;
    text-align:center;
    background:rgba(255,255,255,.02);
    cursor:pointer;
}

.upload strong{
    display:block;
    color:var(--accent);
    font-size:12px;
}

.upload span{
    color:var(--muted);
    font-size:10px;
}

.types{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.type{
    border:1px solid var(--border);
    background:#0c1016;
    color:#8992a3;
    border-radius:9px;
    padding:11px 5px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    transition:.18s;
}

.type:hover{
    border-color:rgba(255,255,255,.2);
}

.type.active{
    background:var(--accent);
    color:#050608;
    border-color:var(--accent);
}

#lastMatchesField,
#clubField{
    animation:slideDown .2s ease;
}

@keyframes slideDown{

    from{
        opacity:0;
        transform:translateY(-5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.colors{
    display:flex;
    gap:10px;
}

.color{
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    transition:.2s;
    outline:none;
}

.color:hover{
    transform:scale(1.06);
}

.color.active{
    border-color:white;
    transform:scale(1.13);
    box-shadow:0 0 0 2px rgba(255,255,255,.12);
}

.c-blue{
    background:#3498ff;
}

.c-pink{
    background:#ff4f9a;
}

.c-yellow{
    background:#ffd429;
}

.download{
    width:100%;
    border:0;
    background:var(--accent);
    color:#050608;
    padding:15px;
    border-radius:11px;
    font-weight:900;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.download:hover{
    filter:brightness(1.08);
    transform:translateY(-1px);
}

.download:disabled{
    opacity:.6;
    cursor:wait;
    transform:none;
}

.card{
    width:540px;
    height:675px;
    position:relative;
    overflow:hidden;
    background:#080a0e;
    border-radius:20px;
    box-shadow:0 35px 90px rgba(0,0,0,.55);
    flex-shrink:0;
}

.card-bg{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 7% 3%,
            var(--accent),
            transparent 32%
        ),
        radial-gradient(
            circle at 95% 78%,
            rgba(255,255,255,.10),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #171c25,
            #0c1017 50%,
            #05070a
        );
}

.color-glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    right:-230px;
    top:-160px;
    background:var(--accent);
    filter:blur(100px);
    opacity:.20;
}

.grid-bg{
    position:absolute;
    inset:0;
    opacity:.10;

    background-image:
        linear-gradient(
            rgba(255,255,255,.17) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.17) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 75%
        );
}

.diagonal{
    position:absolute;
    width:140%;
    height:340px;
    right:-45%;
    top:210px;
    transform:rotate(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.035),
            var(--accent),
            rgba(255,255,255,.025),
            transparent
        );

    opacity:.28;
}

.diagonal-two{
    position:absolute;
    width:120%;
    height:2px;
    right:-15%;
    top:52%;
    transform:rotate(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--accent),
            rgba(255,255,255,.8),
            transparent
        );

    opacity:.35;
}

.card-content{
    position:absolute;
    inset:0;
    padding:30px;
    z-index:5;
}

.big-number{
    position:absolute;
    right:-20px;
    top:4%;
    font-size:225px;
    line-height:.85;
    font-weight:900;
    color:rgba(255,255,255,.045);
    letter-spacing:-24px;
    z-index:1;
}

.player-image{
    position:absolute;
    height:88%;
    width:auto;
    max-width:100%;
    left:50%;
    top:3%;
    transform:translateX(-50%);
    object-fit:contain;
    object-position:center top;

    filter:
        saturate(1.12)
        contrast(1.04);

    z-index:2;

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 62%,
            rgba(0,0,0,.90) 70%,
            transparent 84%
        );
}

.photo-placeholder{
    position:absolute;
    left:0;
    right:0;
    top:35%;
    text-align:center;
    color:rgba(255,255,255,.10);
    font-size:90px;
    z-index:2;
}

.player-info{
    position:absolute;
    left:30px;
    right:30px;
    bottom:174px;
    z-index:7;
}

.position{
    display:inline-block;
    background:var(--accent);
    color:#050608;
    padding:6px 10px;
    border-radius:5px;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.player-name{
    font-family:"Space Grotesk";
    font-size:47px;
    line-height:.88;
    font-weight:900;
    letter-spacing:-3px;
    margin-top:10px;
    text-transform:uppercase;
    color:#ffffff;

    text-shadow:
        -1px -1px 0 var(--accent),
         1px -1px 0 var(--accent),
        -1px  1px 0 var(--accent),
         1px  1px 0 var(--accent),
         0 4px 8px rgba(0,0,0,.95),
         0 8px 18px rgba(0,0,0,.65);
}

.player-country{
    display:flex;
    align-items:center;
    gap:8px;
    color:rgba(255,255,255,.72);
    font-size:10px;
    margin-top:10px;
}

.country-dot{
    width:8px;
    height:8px;
    background:var(--accent);
    border-radius:50%;
}

.stats-box{
    position:absolute;
    left:30px;
    right:30px;
    bottom:20px;
    z-index:20;
    background:#030405;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    border:1px solid rgba(255,255,255,.14);
    border-radius:15px;
    padding:17px 13px;
    box-shadow:0 15px 40px rgba(0,0,0,.65);
}

.stats-title{
    color:rgba(255,255,255,.60);
    font-size:8px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:15px;
    font-weight:800;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.stat-card{
    text-align:center;
    border-right:1px solid rgba(255,255,255,.10);
}

.stat-card:last-child{
    border-right:0;
}

.stat-value{
    font-size:60px;
    line-height:.95;
    font-weight:900;
    letter-spacing:-1.5px;
    color:var(--number);
}

.stat-label{
    margin-top:7px;
    color:var(--label);
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:800;
}

body[data-color="blue"]{
    --accent:#3498ff;
    --number:#ffffff;
    --label:#3498ff;
}

body[data-color="blue"] .card-bg{
    background:
        radial-gradient(
            circle at 7% 3%,
            rgba(52,152,255,.90),
            transparent 32%
        ),
        radial-gradient(
            circle at 95% 78%,
            rgba(255,255,255,.12),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #131d29,
            #09111c 55%,
            #04070b
        );
}

body[data-color="pink"]{
    --accent:#ff4f9a;
    --number:#ff4f9a;
    --label:#ffffff;
}

body[data-color="pink"] .card-bg{
    background:
        radial-gradient(
            circle at 8% 3%,
            rgba(255,79,154,.92),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(255,79,154,.25),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #1a0b15,
            #090509 60%,
            #030304
        );
}

body[data-color="pink"] .diagonal{
    background:
        linear-gradient(
            90deg,
            transparent,
            #ff4f9a,
            rgba(255,255,255,.30),
            transparent
        );
}

body[data-color="yellow"]{
    --accent:#ffd429;
    --number:#ffd429;
    --label:#ffffff;
}

body[data-color="yellow"] .card-bg{
    background:
        radial-gradient(
            circle at 8% 3%,
            rgba(255,212,41,.95),
            transparent 31%
        ),
        radial-gradient(
            circle at 90% 82%,
            rgba(52,152,255,.52),
            transparent 36%
        ),
        linear-gradient(
            145deg,
            #191609,
            #09101a 60%,
            #04070b
        );
}

body[data-color="yellow"] .diagonal{
    background:
        linear-gradient(
            90deg,
            transparent,
            #ffd429,
            #3498ff,
            #ff4055,
            transparent
        );

    opacity:.35;
}

body[data-color="yellow"] .diagonal-two{
    background:
        linear-gradient(
            90deg,
            transparent,
            #ffd429,
            #3498ff,
            #ff4055,
            transparent
        );
}

@media(max-width:950px){

    .workspace{
        grid-template-columns:1fr;
    }

    .controls{
        max-width:600px;
        width:100%;
        margin:auto;
    }

}

@media(max-width:600px){

    .app{
        width:calc(100% - 18px);
    }

    .header{
        flex-direction:column;
        gap:15px;
    }

    .header small{
        margin-top:0;
    }

    .card{
        width:100%;
        height:auto;
        aspect-ratio:4/5;
    }

    .player-name{
        font-size:32px;
        letter-spacing:-2px;
    }

    .big-number{
        font-size:150px;
    }

    .stat-value{
        font-size:23px;
    }

}

</style>

</head>

<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const fields = {

    name:
        document.getElementById("name"),

    club:
        document.getElementById("club"),

    position:
        document.getElementById("position"),

    year:
        document.getElementById("year"),

    number:
        document.getElementById("number"),

    country:
        document.getElementById("country"),

    matches:
        document.getElementById("matches"),

    goals:
        document.getElementById("goals"),

    assists:
        document.getElementById("assists"),

    lastMatches:
        document.getElementById("lastMatches")

};

let currentType = "season";


/* =====================================================
   ACTUALIZAR TARJETA
===================================================== */

function updateCard(){

    document
        .getElementById("previewName")
        .textContent =
        fields.name.value ||
        "NOMBRE";


    document
        .getElementById("previewPosition")
        .textContent =
        fields.position.value ||
        "POS";


    document
        .getElementById("previewNumber")
        .textContent =
        fields.number.value ||
        "10";


    document
        .getElementById("previewCountry")
        .textContent =
        fields.country.value ||
        "";


    document
        .getElementById("pMatches")
        .textContent =
        fields.matches.value ||
        "0";


    document
        .getElementById("pGoals")
        .textContent =
        fields.goals.value ||
        "0";


    document
        .getElementById("pAssists")
        .textContent =
        fields.assists.value ||
        "0";


    const ga =
        Number(fields.goals.value || 0) +
        Number(fields.assists.value || 0);


    document
        .getElementById("pGA")
        .textContent =
        ga;


    /* =================================================
       TÍTULO DE ESTADÍSTICAS
    ================================================= */

    const title =
        document.getElementById("statsTitle");


    if(currentType === "last"){

        const amount =
            fields.lastMatches.value;


        title.textContent =
            amount
                ? `ÚLTIMOS ${amount} PARTIDOS`
                : "ÚLTIMOS PARTIDOS";

    }


    else if(currentType === "career"){

        title.textContent =
            "TOTAL CARRERA FUTBOLÍSTICA";

    }


    else if(currentType === "club"){

        const club =
            fields.club.value.trim();


        title.textContent =
            club
                ? `TOTAL ESTADÍSTICAS · ${club.toUpperCase()}`
                : "TOTAL ESTADÍSTICAS · CLUB";

    }


    else{

        title.textContent =
            `TEMPORADA · ${
                fields.year.value ||
                "2025/26"
            }`;

    }

}


/* =====================================================
   TIPOS DE ESTADÍSTICA
===================================================== */

document
    .querySelectorAll(".type")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(".type")
                    .forEach(b =>
                        b.classList.remove("active")
                    );


                this.classList.add("active");


                currentType =
                    this.dataset.type;


                const lastField =
                    document.getElementById(
                        "lastMatchesField"
                    );


                const clubField =
                    document.getElementById(
                        "clubField"
                    );


                if(currentType === "last"){

                    lastField.style.display =
                        "block";

                }

                else{

                    lastField.style.display =
                        "none";

                }


                if(currentType === "club"){

                    clubField.style.display =
                        "block";

                }

                else{

                    clubField.style.display =
                        "none";

                }


                updateCard();

            }
        );

    });


/* =====================================================
   INPUTS EN TIEMPO REAL
===================================================== */

Object
    .values(fields)
    .forEach(input => {

        if(!input){
            return;
        }


        input.addEventListener(
            "input",
            updateCard
        );

    });


/* =====================================================
   FOTO
===================================================== */

document
    .getElementById("photo")
    .addEventListener(
        "change",
        function(e){

            const file =
                e.target.files[0];


            if(!file){
                return;
            }


            if(
                !file.type.startsWith("image/")
            ){

                alert(
                    "Selecciona una imagen JPG o PNG."
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const img =
                        document.getElementById(
                            "previewPhoto"
                        );


                    img.onload =
                        function(){

                            img.style.display =
                                "block";


                            document
                                .getElementById(
                                    "placeholder"
                                )
                                .style.display =
                                "none";

                        };


                    img.src =
                        event.target.result;

                };


            reader.readAsDataURL(file);

        }
    );


/* =====================================================
   COLORES
===================================================== */

document
    .querySelectorAll(".color")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(".color")
                    .forEach(b =>
                        b.classList.remove("active")
                    );


                this.classList.add("active");


                document.body.dataset.color =
                    this.dataset.color;

            }
        );

    });


/* =====================================================
   ESPERAR IMAGEN
===================================================== */

function waitForImage(image){

    return new Promise(resolve => {

        if(
            !image ||
            image.style.display === "none"
        ){

            resolve();
            return;

        }


        if(image.complete){

            resolve();
            return;

        }


        image.onload = () => resolve();

        image.onerror = () => resolve();

    });

}


/* =====================================================
   ESPERAR FUENTES
===================================================== */

async function waitForFonts(){

    if(
        document.fonts &&
        document.fonts.ready
    ){

        try{

            await document.fonts.ready;

        }

        catch(error){

            console.warn(
                "No se pudieron cargar algunas fuentes."
            );

        }

    }

}


/* =====================================================
   EXPORTAR
===================================================== */

async function downloadCard(){

    const card =
        document.getElementById("card");


    const button =
        document.getElementById(
            "downloadButton"
        );


    button.disabled = true;


    button.textContent =
        "GENERANDO PNG...";


    try{

        const photo =
            document.getElementById(
                "previewPhoto"
            );


        await waitForImage(photo);


        await waitForFonts();


        await new Promise(
            resolve =>
                requestAnimationFrame(
                    () =>
                        requestAnimationFrame(
                            resolve
                        )
                )
        );


        const canvas =
            await html2canvas(
                card,
                {

                    scale:3,

                    width:540,

                    height:675,

                    useCORS:true,

                    allowTaint:false,

                    backgroundColor:
                        "#080a0e",

                    logging:false,

                    imageTimeout:0,

                    removeContainer:true

                }
            );


        const output =
            document.createElement("canvas");


        output.width = 1080;

        output.height = 1350;


        const ctx =
            output.getContext("2d");


        ctx.imageSmoothingEnabled = true;

        ctx.imageSmoothingQuality =
            "high";


        ctx.drawImage(
            canvas,
            0,
            0,
            canvas.width,
            canvas.height,
            0,
            0,
            1080,
            1350
        );


        let cleanName =

            (
                fields.name.value ||
                "player"
            )
            .trim()
            .replace(
                /[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s-]/g,
                ""
            )
            .replace(
                /\s+/g,
                "-"
            )
            .toLowerCase();


        if(!cleanName){

            cleanName =
                "player";

        }


        const blob =
            await new Promise(
                resolve =>
                    output.toBlob(
                        resolve,
                        "image/png"
                    )
            );


        if(!blob){

            throw new Error(
                "No se pudo crear el archivo PNG."
            );

        }


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;


        link.download =
            `football-card-${cleanName}-1080x1350.png`;


        link.style.display =
            "none";


        document.body.appendChild(link);


        link.click();


        document.body.removeChild(link);


        setTimeout(
            () => {

                URL.revokeObjectURL(url);

            },
            1500
        );

    }


    catch(error){

        console.error(
            "ERROR EXPORTANDO:",
            error
        );


        alert(
            "No se pudo exportar la tarjeta. Intenta nuevamente."
        );

    }


    finally{

        button.disabled = false;


        button.textContent =
            "↓ DESCARGAR PNG · 1080 × 1350";

    }

}


/* =====================================================
   INICIO
===================================================== */

updateCard();

</script>
