<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resultados Finales - Generador de Fútbol</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    padding: 30px;
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
}


/* =========================================================
   BOTÓN INICIO
========================================================= */

.boton-inicio {
    display: block;
    width: 100%;
    max-width: 700px;
    margin: 0 auto 20px auto;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
}

.boton-inicio:hover {
    background: #111;
}


/* =========================================================
   PANEL
========================================================= */

.panel {
    max-width: 700px;
    margin: 0 auto 40px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

.panel h1 {
    text-align: center;
    margin: 0 0 25px 0;
}

.campo {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    border: 1px solid #cccccc;
    border-radius: 8px;
    background: white;
}

.marcadores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}


/* =========================================================
   BOTONES
========================================================= */

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.boton-exportar {
    background: #168a3b;
    margin-top: 15px;
}


/* =========================================================
   CONTENEDOR RESULTADO
========================================================= */

.contenedor-resultado {
    width: 100%;
    display: flex;
    justify-content: center;
    overflow: hidden;
}


/* =========================================================
   RESULTADO EXACTO 1080 x 1350
========================================================= */

#resultado {

    width: 1080px;
    height: 1350px;

    min-width: 1080px;
    min-height: 1350px;

    max-width: 1080px;
    max-height: 1350px;

    position: relative;

    overflow: hidden;

    color: white;

    background: #111;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.25);
}


/* =========================================================
   DEGRADADO
========================================================= */

#fondoDegradado {

    position: absolute;

    top: 0;
    left: 0;

    width: 1080px;
    height: 310px;

    display: block;

    z-index: 0;

    pointer-events: none;
}


/* =========================================================
   PARTE SUPERIOR
========================================================= */

.parte-superior {

    position: absolute;

    top: 0;
    left: 0;

    width: 1080px;
    height: 310px;

    z-index: 10;

    padding:
        35px
        50px
        25px
        50px;

    background: transparent;
}


/* =========================================================
   ENCABEZADO
========================================================= */

.encabezado {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    height: 55px;

    position: relative;

    z-index: 20;
}


/* =========================================================
   COMPETICIÓN
========================================================= */

.nombre-pagina {

    font-size: 29px;

    font-weight: 900;

    letter-spacing: -1px;

    color: white;

    text-shadow:
        0 3px 10px
        rgba(0,0,0,0.85);

    text-transform: uppercase;

    white-space: nowrap;

    max-width: 650px;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   LOGO
========================================================= */

.datos-competicion {

    text-align: right;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 10px;

    white-space: nowrap;

    width: 190px;

    height: 55px;
}

.logo-pagina {

    display: block;

    width: auto;

    height: 93.6px;

    max-width: none;

    max-height: 93.6px;

    object-fit: contain;

    object-position: center;

    filter:
        drop-shadow(
            0 4px 9px
            rgba(0,0,0,0.75)
        );
}


/* =========================================================
   DATOS PARTIDO
========================================================= */

.datos-partido {

    display: grid;

    grid-template-columns:
        1fr
        300px
        1fr;

    align-items: center;

    text-align: center;

    margin-top: 15px;

    position: relative;

    height: 200px;
}


/* =========================================================
   EQUIPOS
========================================================= */

.equipo {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    height: 200px;

    position: relative;

    overflow: visible;

    min-width: 0;
}


/* =========================================================
   ESCUDOS
========================================================= */

.escudo {

    width: auto;

    height: 168px;

    max-width: 252px;

    max-height: 168px;

    min-width: 0;

    min-height: 0;

    object-fit: contain;

    object-position: center;

    display: none;

    margin-bottom: 8px;

    flex-shrink: 1;

    filter:
        drop-shadow(
            0 7px 12px
            rgba(0,0,0,0.75)
        );
}


/* =========================================================
   NOMBRES EQUIPOS
========================================================= */

.nombre-equipo {

    font-size: 30px;

    font-weight: 900;

    line-height: 1.05;

    text-transform: uppercase;

    color: white;

    text-shadow:
        0 4px 15px
        rgba(0,0,0,0.90);

    white-space: nowrap;

    flex-shrink: 0;

    position: relative;

    z-index: 20;
}


/* =========================================================
   MARCADOR
========================================================= */

.marcador {

    font-size: 150px;

    font-weight: 900;

    line-height: 0.85;

    white-space: nowrap;

    color: white;

    text-shadow:
        0 6px 25px
        rgba(0,0,0,0.95);

    position: relative;

    top: -5px;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    width: 300px;

    text-align: center;
}

.numero-marcador {

    display: inline-block;

    line-height: 0.85;

    flex-shrink: 0;
}

.guion-marcador {

    display: inline-block;

    margin-left: 3px;

    margin-right: 3px;

    line-height: 0.85;

    flex-shrink: 0;
}


/* =========================================================
   ESTADO
========================================================= */

.estado {

    position: absolute;

    bottom: 8px;

    left: 540px;

    transform:
        translateX(-50%);

    padding:
        7px
        24px;

    border:
        2px solid
        white;

    border-radius: 30px;

    font-size: 17px;

    font-weight: 900;

    text-transform: uppercase;

    white-space: nowrap;

    color: white;

    background:
        rgba(0,0,0,0.32);

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.55);

    z-index: 30;

    width: max-content;

    text-align: center;
}


/* =========================================================
   FOTO
========================================================= */

.zona-foto {

    position: absolute;

    top: 310px;
    left: 0;

    width: 1080px;
    height: 1040px;

    overflow: hidden;

    background: #111;

    z-index: 5;
}

.foto-partido {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: none;

    object-fit: cover;

    object-position: center center;

    filter:
        saturate(1.05)
        contrast(1.05);

    z-index: 2;
}

.sin-foto {

    width: 1080px;
    height: 1040px;

    display: flex;

    justify-content: center;

    align-items: center;

    color: white;

    font-size: 35px;

    font-weight: bold;

    background: #111;

    text-shadow:
        0 3px 10px
        rgba(0,0,0,0.8);
}


/* =========================================================
   EXPORTACIÓN
========================================================= */

#zonaExportacion {

    position: fixed;

    left: -15000px;

    top: 0;

    width: 1080px;

    height: 1350px;

    overflow: hidden;

    background: #111;

    z-index: 999999;

    pointer-events: none;
}

#zonaExportacion #resultadoExportado {

    width: 1080px !important;

    height: 1350px !important;

    min-width: 1080px !important;

    min-height: 1350px !important;

    max-width: 1080px !important;

    max-height: 1350px !important;

    position: relative !important;

    transform: none !important;

    margin: 0 !important;

    padding: 0 !important;

    left: 0 !important;

    top: 0 !important;

    overflow: hidden !important;

    box-shadow: none !important;
}


/* =========================================================
   OCULTAR LOGO SOLAMENTE EN EXPORTACIÓN
========================================================= */

#zonaExportacion .logo-pagina {

    display: none !important;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1100px) {

    #resultado {

        transform: scale(.7);

        transform-origin:
            top center;

        margin-bottom: -405px;
    }
}

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .panel {
        padding: 20px;
    }

    .marcadores {
        grid-template-columns: 1fr;
    }

    #resultado {

        transform: scale(.48);

        transform-origin:
            top center;

        margin-bottom: -702px;
    }
}

</style>

</head>

<body>


<a
    href="index.html"
    class="boton-inicio"
>
    ← VOLVER AL INICIO
</a>


<div class="panel">

<h1>
⚽ RESULTADOS FINALES
</h1>


<div class="campo">

<label>
Competición
</label>

<input
    type="text"
    id="competicionInput"
    value="LA LIGA"
>

</div>


<div class="campo">

<label>
Jornada
</label>

<input
    type="text"
    id="jornadaInput"
    value="JORNADA 2"
>

</div>


<div class="campo">

<label>
Equipo local
</label>

<input
    type="text"

<div class="campo">

    accept="image/png,image/jpeg,image/webp"

<label>
Página / Logo

<select id="paginaInput">

SBM SPORTS

<script>

/* =========================================================
   RUTAS DE LOS LOGOS
========================================================= */

const logosPaginas = {

    sbm:
        "SportsSBM.png",

    chica:
        "ChicaSports.png",

    fan:
        "FanTricolor.png"

};


/* =========================================================
   COLORES
========================================================= */

const coloresTemas = {

    sbm: {

        exterior: "#0759b5",
        exteriorClaro: "#0875e8",
        exteriorOscuro: "#043b78"

    },

    chica: {

        exterior: "#e83287",
        exteriorClaro: "#ff4da0",
        exteriorOscuro: "#941448"

    },

    fan: {

        exterior: "#f2c300",
        exteriorClaro: "#ffdf32",
        exteriorOscuro: "#b38e00"

    }

};


/* =========================================================
   HEX A RGB
========================================================= */

function hexToRgb(hex) {

    hex =
        hex.replace("#","");

    if(hex.length === 3) {

        hex =
            hex
            .split("")
            .map(c => c + c)
            .join("");

    }

    const numero =
        parseInt(hex,16);

    return {

        r:
            (numero >> 16) & 255,

        g:
            (numero >> 8) & 255,

        b:
            numero & 255

    };

}


/* =========================================================
   CAMBIAR LOGO
========================================================= */

function cambiarLogo(tema) {

    const logo =
        document.getElementById(
            "paginaLogoResultado"
        );

    if(!logo) {
        return;
    }

    logo.src =
        logosPaginas[tema];

}


/* =========================================================
   DEGRADADO
========================================================= */

function dibujarDegradado(tema) {

    const canvas =
        document.getElementById(
            "fondoDegradado"
        );

    if(!canvas) {
        return;
    }

    const ctx =
        canvas.getContext("2d");

    const colores =
        coloresTemas[tema];

    const rgb =
        hexToRgb(
            colores.exterior
        );

    const rgbClaro =
        hexToRgb(
            colores.exteriorClaro
        );

    const rgbOscuro =
        hexToRgb(
            colores.exteriorOscuro
        );


    ctx.clearRect(
        0,
        0,
        1080,
        310
    );


    ctx.fillStyle =
        colores.exterior;

    ctx.fillRect(
        0,
        0,
        1080,
        310
    );


    /* AURA NEGRA */

    const negroPrincipal =
        ctx.createRadialGradient(
            540,
            145,
            10,
            540,
            145,
            700
        );

    negroPrincipal.addColorStop(
        0,
        "rgba(0,0,0,0.98)"
    );

    negroPrincipal.addColorStop(
        0.20,
        "rgba(0,0,0,0.94)"
    );

    negroPrincipal.addColorStop(
        0.40,
        "rgba(0,0,0,0.72)"
    );

    negroPrincipal.addColorStop(
        0.60,
        "rgba(0,0,0,0.40)"
    );

    negroPrincipal.addColorStop(
        0.80,
        "rgba(0,0,0,0.12)"
    );

    negroPrincipal.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        negroPrincipal;

    ctx.fillRect(
        0,
        0,
        1080,
        310
    );


    /* CENTRO */

    const centro =
        ctx.createRadialGradient(
            540,
            145,
            0,
            540,
            145,
            420
        );

    centro.addColorStop(
        0,
        "rgba(0,0,0,0.70)"
    );

    centro.addColorStop(
        0.35,
        "rgba(0,0,0,0.40)"
    );

    centro.addColorStop(
        0.70,
        "rgba(0,0,0,0.08)"
    );

    centro.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        centro;

    ctx.fillRect(
        0,
        0,
        1080,
        310
    );


    /* LUZ IZQUIERDA */

    const izquierda =
        ctx.createRadialGradient(
            0,
            155,
            20,
            0,
            155,
            450
        );

    izquierda.addColorStop(
        0,
        `rgba(${rgbClaro.r},${rgbClaro.g},${rgbClaro.b},0.34)`
    );

    izquierda.addColorStop(
        0.35,
        `rgba(${rgb.r},${rgb.g},${rgb.b},0.18)`
    );

    izquierda.addColorStop(
        0.70,
        `rgba(${rgbOscuro.r},${rgbOscuro.g},${rgbOscuro.b},0.06)`
    );

    izquierda.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        izquierda;

    ctx.fillRect(
        0,
        0,
        540,
        310
    );


    /* LUZ DERECHA */

    const derecha =
        ctx.createRadialGradient(
            1080,
            155,
            20,
            1080,
            155,
            450
        );

    derecha.addColorStop(
        0,
        `rgba(${rgbClaro.r},${rgbClaro.g},${rgbClaro.b},0.34)`
    );

    derecha.addColorStop(
        0.35,
        `rgba(${rgb.r},${rgb.g},${rgb.b},0.18)`
    );

    derecha.addColorStop(
        0.70,
        `rgba(${rgbOscuro.r},${rgbOscuro.g},${rgbOscuro.b},0.06)`
    );

    derecha.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        derecha;

    ctx.fillRect(
        540,
        0,
        540,
        310
    );

}


/* =========================================================
   CAMBIAR TEMA
========================================================= */

function cambiarTema(tema) {

    cambiarLogo(tema);

    dibujarDegradado(tema);

}


/* =========================================================
   SELECT LOGO
========================================================= */

document
    .getElementById("paginaInput")
    .addEventListener(
        "change",
        function() {

            cambiarTema(
                this.value
            );

        }
    );


/* =========================================================
   GENERAR RESULTADO
========================================================= */

function generarResultado() {

    const competicion =
        document.getElementById(
            "competicionInput"
        ).value;

    const jornada =
        document.getElementById(
            "jornadaInput"
        ).value;

    const local =
        document.getElementById(
            "localInput"
        ).value;

    const visitante =
        document.getElementById(
            "visitanteInput"
        ).value;

    const golesLocal =
        document.getElementById(
            "golesLocalInput"
        ).value;

    const golesVisitante =
        document.getElementById(
            "golesVisitanteInput"
        ).value;

    const estado =
        document.getElementById(
            "estadoInput"
        ).value;

    const pagina =
        document.getElementById(
            "paginaInput"
        ).value;


    document.getElementById(
        "competicionResultado"
    ).innerText =
        (
            competicion +
            " | " +
            jornada
        ).toUpperCase();


    document.getElementById(
        "localResultado"
    ).innerText =
        local.toUpperCase();


    document.getElementById(
        "visitanteResultado"
    ).innerText =
        visitante.toUpperCase();


    document.getElementById(
        "golesLocalResultado"
    ).innerText =
        golesLocal;


    document.getElementById(
        "golesVisitanteResultado"
    ).innerText =
        golesVisitante;


    document.getElementById(
        "estadoResultado"
    ).innerText =
        estado.toUpperCase();


    cambiarTema(
        pagina
    );

}


/* =========================================================
   CARGAR ESCUDO
========================================================= */

function cargarEscudo(event, equipo) {

    const archivo =
        event.target.files[0];

    if(!archivo) {
        return;
    }

    const lector =
        new FileReader();

    lector.onload =
        function(e) {

            let id;

            if(equipo === "local") {

                id =
                    "escudoLocalResultado";

            } else {

                id =
                    "escudoVisitanteResultado";

            }


            const escudo =
                document.getElementById(id);


            escudo.onload =
                function() {

                    escudo.style.display =
                        "block";

                };


            escudo.src =
                e.target.result;

        };


    lector.readAsDataURL(
        archivo
    );

}


/* =========================================================
   CARGAR FOTO
========================================================= */

function cargarFoto(event) {

    const archivo =
        event.target.files[0];

    if(!archivo) {
        return;
    }

    const lector =
        new FileReader();


    lector.onload =
        function(e) {

            const foto =
                document.getElementById(
                    "fotoResultado"
                );

            const sinFoto =
                document.getElementById(
                    "sinFoto"
                );


            foto.onload =
                function() {

                    foto.style.display =
                        "block";

                    sinFoto.style.display =
                        "none";

                };


            foto.src =
                e.target.result;

        };


    lector.readAsDataURL(
        archivo
    );

}


/* =========================================================
   CONVERTIR IMAGEN A DATA URL
========================================================= */

function imagenComoDataURL(img) {

    return new Promise(
        function(resolve, reject) {

            if(
                !img ||
                !img.src
            ) {

                resolve(null);

                return;

            }


            if(
                img.src.startsWith("data:")
            ) {

                resolve(
                    img.src
                );

                return;

            }


            const imagen =
                new Image();


            imagen.crossOrigin =
                "anonymous";


            imagen.onload =
                function() {

                    try {

                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            imagen.naturalWidth;


                        canvas.height =
                            imagen.naturalHeight;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        ctx.drawImage(
                            imagen,
                            0,
                            0
                        );


                        const dataURL =
                            canvas.toDataURL(
                                "image/png"
                            );


                        resolve(
                            dataURL
                        );

                    }
                    catch(error) {

                        reject(error);

                    }

                };


            imagen.onerror =
                function() {

                    reject(
                        new Error(
                            "No se pudo cargar la imagen: " +
                            img.src
                        )
                    );

                };


            imagen.src =
                img.src;

        }
    );

}


/* =========================================================
   ESPERAR IMÁGENES
========================================================= */

function esperarImagenes(elemento) {

    const imagenes =
        elemento.querySelectorAll("img");


    const promesas = [];


    imagenes.forEach(
        function(img) {

            if(
                img.style.display === "none"
            ) {

                return;

            }


            if(
                img.complete &&
                img.naturalWidth > 0
            ) {

                return;

            }


            promesas.push(

                new Promise(
                    function(resolve) {

                        const terminar =
                            function() {

                                resolve();

                            };


                        img.addEventListener(
                            "load",
                            terminar,
                            {
                                once: true
                            }
                        );


                        img.addEventListener(
                            "error",
                            terminar,
                            {
                                once: true
                            }
                        );


                        setTimeout(
                            resolve,
                            5000
                        );

                    }
                )

            );

        }
    );


    return Promise.all(
        promesas
    );

}


/* =========================================================
   CREAR CLON PARA EXPORTACIÓN
========================================================= */

async function crearZonaExportacion() {

    const anterior =
        document.getElementById(
            "zonaExportacion"
        );

    if(anterior) {
        anterior.remove();
    }


    const zona =
        document.createElement("div");

    zona.id =
        "zonaExportacion";


    const original =
        document.getElementById(
            "resultado"
        );


    const clon =
        original.cloneNode(true);


    clon.id =
        "resultadoExportado";


    zona.appendChild(
        clon
    );


    document.body.appendChild(
        zona
    );


    /* =====================================================
       CANVAS DEGRADADO
    ===================================================== */

    const canvasOriginal =
        document.getElementById(
            "fondoDegradado"
        );

    const canvasClonado =
        clon.querySelector(
            "#fondoDegradado"
        );


    if(
        canvasOriginal &&
        canvasClonado
    ) {

        canvasClonado.width =
            1080;

        canvasClonado.height =
            310;

        canvasClonado.style.width =
            "1080px";

        canvasClonado.style.height =
            "310px";


        const ctx =
            canvasClonado.getContext(
                "2d"
            );


        ctx.clearRect(
            0,
            0,
            1080,
            310
        );


        ctx.drawImage(
            canvasOriginal,
            0,
            0,
            1080,
            310
        );

    }


    /* =====================================================
       COPIAR IMÁGENES
    ===================================================== */

    const imagenesOriginal =
        original.querySelectorAll("img");

    const imagenesClon =
        clon.querySelectorAll("img");


    for(
        let index = 0;
        index < imagenesOriginal.length;
        index++
    ) {

        const imgOriginal =
            imagenesOriginal[index];

        const imgClon =
            imagenesClon[index];


        if(!imgClon) {
            continue;
        }


        imgClon.style.display =
            imgOriginal.style.display;


        imgClon.style.width =
            imgOriginal.style.width;


        imgClon.style.height =
            imgOriginal.style.height;


        imgClon.style.objectFit =
            imgOriginal.style.objectFit;


        imgClon.style.objectPosition =
            imgOriginal.style.objectPosition;


        try {

            const dataURL =
                await imagenComoDataURL(
                    imgOriginal
                );


            if(dataURL) {

                imgClon.src =
                    dataURL;

            }

        }
        catch(error) {

            console.warn(
                "No se pudo convertir la imagen:",
                imgOriginal.src,
                error
            );


            imgClon.src =
                imgOriginal.src;

        }

    }


    /* =====================================================
       QUITAR LOGO DE LA EXPORTACIÓN
    ===================================================== */

    const logo =
        clon.querySelector(
            ".logo-pagina"
        );


    if(logo) {

        logo.remove();

    }


    /* =====================================================
       FOTO
    ===================================================== */

    const foto =
        clon.querySelector(
            ".foto-partido"
        );


    if(foto) {

        foto.style.width =
            "1080px";

        foto.style.height =
            "1040px";

        foto.style.objectFit =
            "cover";

        foto.style.objectPosition =
            "center center";

    }


    /* =====================================================
       ESCUDOS
    ===================================================== */

    const escudos =
        clon.querySelectorAll(
            ".escudo"
        );


    escudos.forEach(
        function(escudo) {

            escudo.style.width =
                "auto";

            escudo.style.height =
                "168px";

            escudo.style.maxWidth =
                "252px";

            escudo.style.maxHeight =
                "168px";

            escudo.style.objectFit =
                "contain";

        }
    );


    /* =====================================================
       ZONA FOTO
    ===================================================== */

    const zonaFoto =
        clon.querySelector(
            ".zona-foto"
        );


    if(zonaFoto) {

        zonaFoto.style.width =
            "1080px";

        zonaFoto.style.height =
            "1040px";

        zonaFoto.style.top =
            "310px";

    }


    return zona;

}


/* =========================================================
   EXPORTAR IMAGEN
========================================================= */

async function exportarImagen() {

    const boton =
        document.getElementById(
            "botonExportar"
        );


    if(
        typeof html2canvas ===
        "undefined"
    ) {

        alert(
            "No se pudo cargar html2canvas."
        );

        return;

    }


    boton.disabled =
        true;

    boton.innerText =
        "⏳ PREPARANDO IMAGEN...";


    let zona =
        null;


    try {

        /* =================================================
           CREAR CLON
        ================================================= */

        zona =
            await crearZonaExportacion();


        /* =================================================
           ESPERAR IMÁGENES
        ================================================= */

        await esperarImagenes(
            zona
        );


        /* =================================================
           ESPERAR RENDERIZADO
        ================================================= */

        await new Promise(
            function(resolve) {

                requestAnimationFrame(
                    function() {

                        requestAnimationFrame(
                            function() {

                                setTimeout(
                                    resolve,
                                    500
                                );

                            }
                        );

                    }
                );

            }
        );


        boton.innerText =
            "⏳ GENERANDO PNG...";


        const elemento =
            document.getElementById(
                "resultadoExportado"
            );


        if(!elemento) {

            throw new Error(
                "No se encontró resultadoExportado."
            );

        }


        /* =================================================
           HTML2CANVAS
        ================================================= */

        const canvas =
            await html2canvas(
                elemento,
                {

                    width:
                        1080,

                    height:
                        1350,

                    scale:
                        1,

                    useCORS:
                        true,

                    allowTaint:
                        false,

                    backgroundColor:
                        "#111111",

                    logging:
                        false,

                    imageTimeout:
                        20000,

                    foreignObjectRendering:
                        false,

                    removeContainer:
                        true,

                    scrollX:
                        0,

                    scrollY:
                        0,

                    windowWidth:
                        1080,

                    windowHeight:
                        1350

                }
            );


        if(!canvas) {

            throw new Error(
                "html2canvas no generó la imagen."
            );

        }


        /* =================================================
           CANVAS FINAL
        ================================================= */

        const canvasFinal =
            document.createElement(
                "canvas"
            );


        canvasFinal.width =
            1080;

        canvasFinal.height =
            1350;


        const ctx =
            canvasFinal.getContext(
                "2d"
            );


        ctx.fillStyle =
            "#111111";


        ctx.fillRect(
            0,
            0,
            1080,
            1350
        );


        ctx.drawImage(
            canvas,
            0,
            0,
            1080,
            1350
        );


        /* =================================================
           CREAR PNG
        ================================================= */

        boton.innerText =
            "⏳ PREPARANDO PNG...";


        const blob =
            await new Promise(
                function(resolve,reject) {

                    canvasFinal.toBlob(
                        function(blob) {

                            if(blob) {

                                resolve(
                                    blob
                                );

                            }
                            else {

                                reject(
                                    new Error(
                                        "El navegador no pudo crear el PNG."
                                    )
                                );

                            }

                        },
                        "image/png"
                    );

                }
            );


        if(!blob) {

            throw new Error(
                "No se pudo generar el archivo PNG."
            );

        }


        /* =================================================
           COMPARTIR / GUARDAR
        ================================================= */

        const nombreArchivo =
            "resultado-final-1080x1350.png";


        const archivo =
            new File(
                [blob],
                nombreArchivo,
                {
                    type:
                        "image/png"
                }
            );


        /*
           iPhone / iPad / navegadores
           compatibles con compartir archivos
        */

        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files: [archivo]
            })
        ) {

            boton.innerText =
                "📤 ABRIENDO OPCIONES...";


            try {

                await navigator.share({

                    files:
                        [archivo],

                    title:
                        "Resultado final"

                });


                boton.innerText =
                    "✅ IMAGEN LISTA";

            }

            catch(error) {

                /*
                   Si el usuario simplemente
                   cierra el menú de compartir,
                   no mostramos ningún error.
                */

                if(
                    error.name !==
                    "AbortError"
                ) {

                    console.error(
                        "Error al compartir:",
                        error
                    );

                    throw error;

                }


                boton.innerText =
                    "🖼️ EXPORTAR IMAGEN PNG";

            }

        }


        /*
           PC / Android / navegadores
           que no soporten compartir archivos
        */

        else {

            const url =
                URL.createObjectURL(
                    blob
                );


            const enlace =
                document.createElement(
                    "a"
                );


            enlace.href =
                url;


            enlace.download =
                nombreArchivo;


            enlace.style.display =
                "none";


            document.body.appendChild(
                enlace
            );


            enlace.click();


            setTimeout(
                function() {

                    enlace.remove();

                    URL.revokeObjectURL(
                        url
                    );

                },
                1500
            );


            boton.innerText =
                "✅ IMAGEN GUARDADA";


            setTimeout(
                function() {

                    boton.innerText =
                        "🖼️ EXPORTAR IMAGEN PNG";

                },
                2500
            );

        }

    }

    catch(error) {

        console.error(
            "ERROR AL EXPORTAR:",
            error
        );


        alert(
            "NO SE PUDO EXPORTAR LA IMAGEN.\n\n" +
            (
                error.message ||
                error
            )
        );


        boton.innerText =
            "🖼️ EXPORTAR IMAGEN PNG";

    }

    finally {

        boton.disabled =
            false;


        if(zona) {

            setTimeout(
                function() {

                    if(
                        zona &&
                        zona.parentNode
                    ) {

                        zona.remove();

                    }

                },
                500
            );

        }

    }

}
