
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Rankings Deportivos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#080b12;color:white;font-family:Arial,sans-serif}
.container{max-width:720px;margin:auto}
.panel{background:#121d2c;border:1px solid #315b91;border-radius:12px;padding:15px;margin-bottom:18px}
h2{font-size:20px}
.panel-title{font-size:12px;font-weight:900;color:#1686ff;margin-bottom:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-full{grid-column:1/-1}
label{display:block;font-size:11px;color:#b9c9dc;margin-bottom:5px}
input,select{width:100%;padding:12px;background:#080f1b;color:white;border:1px solid #344d6b;border-radius:6px}
button{border:0;border-radius:6px;padding:12px;font-weight:900;cursor:pointer}
.add{width:100%;margin-top:12px;background:#087bff;color:white}
.export{width:100%;margin-top:12px;background:#e5bc58;color:#17120a}
.clear{width:100%;margin-top:8px;background:#34445a;color:white}
.design-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.design{background:#0a111d;color:white;border:2px solid #34465e;padding:12px 4px}
.design.active{border-color:#1686ff;background:#192b43}
.design strong{display:block;font-size:10px}
.design small{display:block;font-size:9px;margin-top:5px;color:#b9c9dc}
.dot{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 7px}

/* TABLA */
.ranking{
--accent:#087bff;
--accent2:#0646a5;
--highlight:#168bff;
--background:#101722;
--row:#142238;
--row2:#192b40;
--border:#315b91;
--leader:#44391f;
width:100%;
padding:15px;
color:white;
background:radial-gradient(ellipse at 100% 0%,#075deb30,transparent 45%),linear-gradient(145deg,var(--background),#080b12);
border:1px solid var(--border);
border-radius:12px;
overflow:hidden;
}
.ranking[data-theme="pink"]{
--accent:#f044a1;
--accent2:#a71968;
--highlight:#ff72bd;
--background:#20121e;
--row:#302033;
--row2:#402641;
--border:#98446f;
--leader:#55303f;
}
.ranking[data-theme="yellow"]{
--accent:#f5c400;
--accent2:#b58a00;
--highlight:#ffdc36;
--background:#1c190d;
--row:#292315;
--row2:#382d18;
--border:#a58a2c;
--leader:#59491c;
}
.topline{display:flex;justify-content:space-between;align-items:center;padding-bottom:11px;border-bottom:1px solid #ffffff30}
.brand{font-size:18px;font-weight:1000;letter-spacing:2px}
.brand span{color:var(--highlight)}
.edition{color:#e3c77d;font-size:9px;font-weight:900}
.headline{padding:16px 0 13px}
.eyebrow{color:var(--highlight);font-size:9px;font-weight:1000;letter-spacing:2px;margin-bottom:7px}
.headline h1{margin:0;font-size:clamp(22px,5vw,29px);line-height:1.08;font-weight:1000}
.headline h1 span{color:var(--highlight)}
.table-shell{overflow:hidden;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.pos{width:13%}
col.club{width:33%}
col.pj{width:11%}
col.pts{width:17%}
col.league-col{width:26%}
thead{background:linear-gradient(100deg,var(--accent2),var(--accent))}
th{padding:12px 2px;font-size:8px;font-weight:1000;letter-spacing:.5px}
th:nth-child(2){text-align:left}
td{padding:8px 2px;text-align:center;font-size:11px;font-weight:800;border-bottom:1px solid #ffffff14}
tbody tr{background:var(--row);height:47px}
tbody tr:nth-child(even){background:var(--row2)}
td:nth-child(2){text-align:left}
.rank{display:inline-flex;justify-content:center;align-items:center;width:28px;height:28px;border-radius:7px;background:#ffffff12;border:1px solid #ffffff30}
.club-name{display:block;color:white;font-size:10px;font-weight:1000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.points{display:inline-block;min-width:37px;padding:7px 5px;border-radius:5px;background:linear-gradient(135deg,var(--highlight),var(--accent2));font-size:15px;font-weight:1000}
.league{display:inline-block;padding:5px 3px;border-radius:4px;font-size:7px;font-weight:1000;white-space:nowrap;background:#ffffff15;border:1px solid #ffffff35}
tbody tr:first-child{background:linear-gradient(90deg,var(--leader),#292c2c);border-top:1px solid #d7ae59}
tbody tr:first-child .rank,tbody tr:first-child .points{background:linear-gradient(135deg,#ffe7a4,#bd8525);color:#211707;border-color:#ffe49a}
tbody tr:first-child .club-name{color:#ffe4a2}
.signature{display:flex;justify-content:space-between;margin-top:12px;padding-top:9px;border-top:1px solid #ffffff20;color:#a5b5ca;font-size:8px;font-weight:900;letter-spacing:1px}
.signature span:last-child{color:var(--highlight)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff20;font-size:11px}
.remove{background:#8e2935;color:white;font-size:10px;padding:7px}
@media(max-width:400px){
body{padding:8px}
.ranking{padding:10px}
.club-name{font-size:9px}
.league{font-size:6px}
th{font-size:7px}
.rank{width:24px;height:24px}
}
</style>
</head>

<body>
<div class="container">

<h2>⚽ GENERADOR DE TABLAS DEPORTIVAS</h2>

<div class="panel">
<div class="panel-title">1. SELECCIONA TU MARCA</div>
<div class="design-options">
<button class="design active" data-choice="blue" onclick="changeTheme('blue')">
<span class="dot" style="background:#087bff"></span>
<strong>SPORTS SBM</strong><small>Azul</small>
</button>
<button class="design" data-choice="pink" onclick="changeTheme('pink')">
<span class="dot" style="background:#f044a1"></span>
<strong>CHICA SPORTS</strong><small>Rosado</small>
</button>
<button class="design" data-choice="yellow" onclick="changeTheme('yellow')">
<span class="dot" style="background:#f5c400"></span>
<strong>FAN TRICOLOR</strong><small>Amarillo</small>
</button>
</div>
</div>

<div class="panel">
<div class="panel-title">2. ADMINISTRA TUS EQUIPOS</div>
<div class="fields">
<div class="field-full">
<label>Nombre del equipo</label>
<input id="team" placeholder="Ej: REAL MADRID">
</div>
<div>
<label>Partidos jugados</label>
<input id="played" type="number" min="0" placeholder="12">
</div>
<div>
<label>Puntos</label>
<input id="points" type="number" min="0" placeholder="30">
</div>
<div class="field-full">
<label>Liga</label>
<select id="league">
<option value="">Seleccionar liga</option>
<option>ESPAÑA</option>
<option>INGLATERRA</option>
<option>ALEMANIA</option>
<option>ITALIA</option>
<option>FRANCIA</option>
<option>PORTUGAL</option>
<option>PAÍSES BAJOS</option>
<option>OTRA</option>
</select>
</div>
</div>
<button class="add" onclick="addTeam()">+ AGREGAR EQUIPO</button>
<button class="clear" onclick="clearTeams()">BORRAR TODOS LOS EQUIPOS</button>
<div id="teamList" style="margin-top:12px"></div>
</div>

<div class="panel">
<div class="panel-title">3. VISTA PREVIA DE TU PUBLICACIÓN</div>

<div class="ranking" id="ranking" data-theme="blue">
<div class="topline">
<div class="brand" id="brand">SPORTS <span>SBM</span></div>
<div class="edition">FÚTBOL INTERNACIONAL</div>
</div>

<div class="headline">
<div class="eyebrow">⚽ RANKING DEL FÚTBOL EUROPEO</div>
<h1>CLUBES CON MÁS PUNTOS EN <span>LIGAS TOP</span></h1>
</div>

<div class="table-shell">
<table>
<colgroup>
<col class="pos"><col class="club"><col class="pj"><col class="pts"><col class="league-col">
</colgroup>
<thead>
<tr><th>POS.</th><th>EQUIPO</th><th>PJ</th><th>PTS</th><th>LIGA</th></tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="signature">
<span>⚽ PASIÓN POR EL FÚTBOL</span>
<span id="signatureBrand">SPORTS SBM</span>
</div>
</div>

<button class="export" id="exportBtn" onclick="exportImage()">📸 DESCARGAR TABLA EN PNG</button>
</div>
</div>

<script>
let teams=[];
try{
teams=JSON.parse(localStorage.getItem("sportsSBMTeams"))||[];
}catch(e){teams=[];}

let currentTheme=localStorage.getItem("sportsSBMTheme")||"blue";

function changeTheme(theme){
currentTheme=theme;
document.getElementById("ranking").dataset.theme=theme;
document.querySelectorAll(".design").forEach(b=>{
b.classList.toggle("active",b.dataset.choice===theme);
});
const brand=document.getElementById("brand");
const signature=document.getElementById("signatureBrand");
if(theme==="blue"){
brand.innerHTML='SPORTS <span>SBM</span>';
signature.textContent="SPORTS SBM";
}
if(theme==="pink"){
brand.innerHTML='CHICA <span>SPORTS</span>';
signature.textContent="CHICA SPORTS";
}
if(theme==="yellow"){
brand.innerHTML='FAN <span>TRICOLOR</span>';
signature.textContent="FAN TRICOLOR";
}
localStorage.setItem("sportsSBMTheme",theme);
}

function addTeam(){
const name=document.getElementById("team").value.trim();
const played=document.getElementById("played").value;
const points=document.getElementById("points").value;
const league=document.getElementById("league").value;

if(!name||played===""||points===""||!league){
alert("Completa todos los campos.");
return;
}
if(Number(played)<0||Number(points)<0){
alert("No se permiten números negativos.");
return;
}

teams.push({
id:Date.now()+Math.random(),
name:name.toUpperCase(),
played:Number(played),
points:Number(points),
league
});

saveData();
renderTable();
document.getElementById("team").value="";
document.getElementById("played").value="";
document.getElementById("points").value="";
document.getElementById("league").value="";
}

function removeTeam(id){
teams=teams.filter(t=>t.id!==id);
saveData();
renderTable();
}

function clearTeams(){
if(!confirm("¿Deseas eliminar todos los equipos?"))return;
teams=[];
saveData();
renderTable();
}

function saveData(){
localStorage.setItem("sportsSBMTeams",JSON.stringify(teams));
}

function renderTable(){
const tbody=document.getElementById("tableBody");
const list=document.getElementById("teamList");
tbody.innerHTML="";
list.innerHTML="";

const sorted=[...teams].sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name));

sorted.forEach((t,i)=>{
const tr=document.createElement("tr");
const cells=[
`<span class="rank">${String(i+1).padStart(2,"0")}</span>`,
`<span class="club-name"></span>`,
t.played,
`<span class="points">${t.points}</span>`,
`<span class="league"></span>`
];
cells.forEach((content,j)=>{
const td=document.createElement("td");
if(j===1){
const span=document.createElement("span");
span.className="club-name";
span.textContent=t.name;
td.appendChild(span);
}else if(j===4){
const span=document.createElement("span");
span.className="league";
span.textContent=t.league;
td.appendChild(span);
}else{
td.innerHTML=content;
}
tr.appendChild(td);
});
tbody.appendChild(tr);

const item=document.createElement("div");
item.className="item";
const info=document.createElement("span");
info.textContent=`${i+1}. ${t.name} | ${t.played} PJ | ${t.points} PTS | ${t.league}`;
const del=document.createElement("button");
del.className="remove";
del.textContent="ELIMINAR";
del.onclick=()=>removeTeam(t.id);
item.append(info,del);
list.appendChild(item);
});

if(!teams.length){
tbody.innerHTML='<tr><td colspan="5" style="padding:25px;color:#a5b5ca">AGREGA TU PRIMER EQUIPO</td></tr>';
list.textContent="Todavía no has agregado equipos.";
}
}

async function exportImage(){
if(!teams.length){
alert("Agrega al menos un equipo.");
return;
}
if(typeof html2canvas==="undefined"){
alert("No se pudo cargar el exportador. Comprueba tu conexión.");
return;
}
const btn=document.getElementById("exportBtn");
btn.disabled=true;
btn.textContent="GENERANDO IMAGEN...";
try{
const canvas=await html2canvas(document.getElementById("ranking"),{
scale:3,
backgroundColor:"#101722",
logging:false
});
const link=document.createElement("a");
const names={
blue:"SPORTS-SBM",
pink:"CHICA-SPORTS",
yellow:"FAN-TRICOLOR"
};
link.download=names[currentTheme]+"-RANKING.png";
link.href=canvas.toDataURL("image/png");
link.click();
}catch(e){
alert("No se pudo generar la imagen. Intenta nuevamente.");
console.error(e);
}finally{
btn.disabled=false;
btn.textContent="📸 DESCARGAR TABLA EN PNG";
}
}

changeTheme(currentTheme);
renderTable();

  /* =========================================================
   REGRESAR AL MENÚ PRINCIPAL
========================================================= */

function regresarMenu() {

    window.location.href =
        "index.html";

}
  
</script>
</body>
</html>
